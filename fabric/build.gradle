version = rootProject.mod_version

base {
    archivesName = "${rootProject.archives_base_name}-fabric-${rootProject.minecraft_version}"
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation files(rootProject.file("libs/fabric-api-${rootProject.fabric_api_version}.jar"))
    implementation files(rootProject.file("libs/architectury-fabric-${rootProject.architectury_version}.jar"))
    implementation project(":common")

    // Mixin annotations for Fabric-module mixins (TrinketSlotMixin etc.)
    compileOnly "net.fabricmc:sponge-mixin:0.17.2+mixin.0.8.7"

    // Trinkets integration uses reflection — no compile dependency needed

    // Cloth Config API (runtime)
    modImplementation files(rootProject.file("libs/cloth-config-${rootProject.cloth_config_version}-fabric.jar"))

    // ModMenu API (compile only — loaded at runtime by ModMenu's entrypoint system)
    modCompileOnly files(rootProject.file("libs/modmenu-17.0.0.jar"))
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand version: project.version
    }
}

jar {
    from project(":common").sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn(":common:jar")
}

sourcesJar {
    dependsOn(":common:sourcesJar")
    from project(":common").sourcesJar.archiveFile.map { zipTree(it) }
}
